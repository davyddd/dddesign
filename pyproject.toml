[project]
name = "dddesign"
description = "Building blocks for Domain-Driven Design on top of pydantic: applications, repositories, adapters, entities, aggregates and errors"
version = "2.1.4"
authors = [{ name = "davyddd" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.16"
keywords = ["python", "dddesign", "ddd", "domain driven design", "domain-driven design", "clean architecture", "hexagonal architecture", "pydantic", "application", "repository", "adapter", "service", "entity", "aggregate", "value object", "dto", "errors"]
# uv_build does not derive these from requires-python (poetry did); PyPI and the pyversions badge read them
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.1,<2.15",
    "ddutils>=0.3.0,<0.5.0",
]

[project.urls]
Repository = "https://github.com/davyddd/dddesign"

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "ipython==9.16.1",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "parameterized==0.9.0",
]
linter = [
    "ruff==0.15.10",
    "ty==0.0.15",
    "complexipy==8.0.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
