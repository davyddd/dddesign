name: Publish Python Package

on:
    push:
        tags:
            - "v*.*.*"

jobs:
    quality-assurance:
        uses: davyddd/dd-lib-stub/.github/workflows/quality_assurance.yml@v0.0.7
        with:
            package-name: dddesign
            test-matrix: '{"python-version": ["3.11", "3.12", "3.13", "3.14"], "pydantic": ["pydantic==2.1", "pydantic==2.11", "pydantic==2.12", "pydantic==2.13"], "exclude": [{"python-version": "3.13", "pydantic": "pydantic==2.1"}, {"python-version": "3.14", "pydantic": "pydantic==2.1"}, {"python-version": "3.14", "pydantic": "pydantic==2.11"}]}'
            default-python-version: '3.14'
            upload-coverage: true
        secrets: inherit
    build:
        needs: quality-assurance
        uses: davyddd/dd-lib-stub/.github/workflows/build_python_package.yml@v0.0.7
        with:
            package-name: dddesign
            python-version: '3.14'
    # PyPI trusted publishing verifies the workflow file of the publishing job, so this job has to live
    # here and cannot be moved into a reusable workflow.
    publish:
        needs: build
        runs-on: ubuntu-24.04
        environment:
            name: pypi
            url: https://pypi.org/p/dddesign
        permissions:
            id-token: write
        steps:
            -   uses: actions/download-artifact@v8.0.1
                with:
                    name: dist
                    path: dist/
            # Also generates PEP 740 attestations
            -   uses: pypa/gh-action-pypi-publish@release/v1
    release:
        needs: publish
        uses: davyddd/dd-lib-stub/.github/workflows/github_release.yml@v0.0.7
        permissions:
            contents: write
