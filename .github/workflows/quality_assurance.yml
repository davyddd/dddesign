name: Quality Assurance

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality-assurance:
        uses: davyddd/dd-lib-stub/.github/workflows/quality_assurance.yml@v0.0.8
        with:
            test-matrix: '{"python-version": ["3.11", "3.12", "3.13", "3.14"], "pydantic": ["pydantic==2.1", "pydantic==2.11", "pydantic==2.12", "pydantic==2.13"], "exclude": [{"python-version": "3.13", "pydantic": "pydantic==2.1"}, {"python-version": "3.14", "pydantic": "pydantic==2.1"}, {"python-version": "3.14", "pydantic": "pydantic==2.11"}]}'
            default-python-version: '3.14'
        secrets: inherit
    coverage:
        # after the checks and only for pushes to main: pull requests do not upload coverage
        needs: quality-assurance
        if: ${{ github.event_name == 'push' }}
        uses: davyddd/dd-lib-stub/.github/workflows/coverage.yml@v0.0.8
        with:
            package-name: dddesign
            python-version: '3.14'
        secrets: inherit
